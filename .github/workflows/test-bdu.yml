name: Test BDU ZIP

on:
  workflow_dispatch:

jobs:
  test-bdu:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "Runner:"
          uname -a
          echo
          echo "Python:"
          python3 --version
          echo
          echo "curl:"
          curl --version
          echo
          echo "unzip:"
          unzip -v | head -n 5

      - name: Check headers
        run: |
          set -euxo pipefail
          curl -I -L --connect-timeout 20 --max-time 120 \
            "https://bdu.fstec.ru/files/documents/vulxml.zip"

      - name: Download ZIP
        run: |
          set -euxo pipefail
          mkdir -p tmp
          curl -L --retry 3 --retry-delay 5 \
            --connect-timeout 20 --max-time 300 \
            -o tmp/vulxml.zip \
            "https://bdu.fstec.ru/files/documents/vulxml.zip"

          ls -lh tmp/vulxml.zip
          du -h tmp/vulxml.zip

      - name: List ZIP contents
        run: |
          set -euxo pipefail
          unzip -l tmp/vulxml.zip | sed -n '1,80p'

      - name: Extract first XML name
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import zipfile

          zf = zipfile.ZipFile("tmp/vulxml.zip")
          names = zf.namelist()

          print("FILES IN ZIP:")
          for n in names:
              print(" -", n)

          xml_names = [n for n in names if n.lower().endswith(".xml")]
          if not xml_names:
              raise SystemExit("XML file not found inside ZIP")

          xml_name = xml_names[0]
          print("XML FOUND:", xml_name)

          with open("tmp/xml_name.txt", "w", encoding="utf-8") as f:
              f.write(xml_name)
          PY

      - name: Show XML first bytes
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import zipfile

          with open("tmp/xml_name.txt", "r", encoding="utf-8") as f:
              xml_name = f.read().strip()

          zf = zipfile.ZipFile("tmp/vulxml.zip")
          with zf.open(xml_name) as xmlf:
              head = xmlf.read(500)

          print("FIRST 500 BYTES:")
          print(head)
          PY