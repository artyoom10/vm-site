name: Test BDU direct GET

on:
  workflow_dispatch:

jobs:
  test-bdu:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Test GET with curl
        run: |
          set -euxo pipefail
          URL="https://bdu.fstec.ru/files/documents/vulxml.zip"

          curl -L -k \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/146.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8" \
            -H "Accept-Language: ru-RU,ru;q=0.9" \
            -H "Cache-Control: no-cache" \
            -H "Pragma: no-cache" \
            -H "Upgrade-Insecure-Requests: 1" \
            --connect-timeout 20 \
            --max-time 120 \
            --range 0-1023 \
            -D /tmp/bdu_headers.txt \
            -o /tmp/bdu_part.bin \
            "$URL"

          echo "=== RESPONSE HEADERS ==="
          cat /tmp/bdu_headers.txt

          echo "=== DOWNLOADED BYTES ==="
          wc -c /tmp/bdu_part.bin || true

          echo "=== FIRST BYTES (HEX) ==="
          xxd -l 64 /tmp/bdu_part.bin || true